<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-label="Map of the six architectural options by language flexibility and structural transparency: rules, pure search, and classical ML are transparent but rigid; pinned open weights and unconstrained models are flexible but opaque; the hybrid option sits in the high-stakes sweet spot, understanding language while code makes the decision" width="1840" height="1020">
  <style>
    .t-b { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
    .t-s { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #475569; }
    .t-c { text-anchor: middle; }
    .t-e { text-anchor: end; }
    .t-m-c { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 12px; font-weight: 700; fill: #0369a1; }
    .t-m-g { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 12.6px; font-weight: 700; fill: #15803d; }
    .t-m-r { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 12.8px; font-weight: 700; fill: #b91c1c; }
    .zl { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 13.2px; letter-spacing: 0.09em; font-weight: 700; fill: #475569; }
    .flow { stroke: #0f172a; stroke-width: 2.1; fill: none; }
    .flow-g { stroke: #15803d; stroke-width: 2.4; fill: none; }
    .node-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.75; }
    .node-dim { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; }
    .node-good { fill: #15803d; fill-opacity: 0.09; stroke: #15803d; stroke-width: 1.8; }
    .node-bad { fill: #b91c1c; fill-opacity: 0.08; stroke: #b91c1c; stroke-width: 1.8; }
    .node-violet { fill: #6d28d9; fill-opacity: 0.09; stroke: #6d28d9; stroke-width: 1.8; }
    .node-cyan { fill: #0369a1; fill-opacity: 0.09; stroke: #0369a1; stroke-width: 1.8; }
  </style>
  <rect x="0" y="0" width="920" height="510" fill="#ffffff"/>
  <defs>
    <marker id="arr-q1o-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" style="fill:#475569"/>
    </marker>
  </defs>

    <rect x="14" y="14" width="892" height="482" rx="14" style="fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.75"/>
    <text class="zl" x="34" y="42">SIX OPTIONS (TABLE 2) · NOT A STRAIGHT TRADE-OFF</text>

    <!-- High-stakes sweet spot -->
    <rect x="580" y="72" width="290" height="168" rx="12" style="fill:#15803d;fill-opacity:0.09;stroke:#15803d;stroke-width:1.6;stroke-dasharray:6 4"/>
    <text class="t-m-g" x="596" y="94">HIGH-STAKES SWEET SPOT</text>

    <!-- Axes -->
    <line x1="120" y1="440" x2="120" y2="76" style="stroke:#475569;stroke-width:1.8" marker-end="url(#arr-q1o-ink)"/>
    <line x1="120" y1="440" x2="872" y2="440" style="stroke:#475569;stroke-width:1.8" marker-end="url(#arr-q1o-ink)"/>
    <text class="zl" x="34" y="66">STRUCTURAL TRANSPARENCY ↑</text>
    <text class="t-s" x="104" y="96" style="text-anchor:end">high</text>
    <text class="t-s" x="104" y="436" style="text-anchor:end">low</text>
    <text class="t-s" x="128" y="462">structured input only</text>
    <text class="t-s t-e" x="870" y="462">open-ended language</text>
    <text class="zl t-c" x="495" y="484">LANGUAGE FLEXIBILITY →</text>

    <!-- 1 · Deterministic rules -->
    <circle class="node-cyan" cx="179" cy="88" r="13"/>
    <text class="t-m-c t-c" x="179" y="92">1</text>
    <text class="t-b" x="200" y="86">Deterministic rules</text>
    <text class="t-s" x="200" y="105">fully inspectable; structured input</text>

    <!-- 6 · Pure search -->
    <circle class="node-cyan" cx="231" cy="159" r="13"/>
    <text class="t-m-c t-c" x="231" y="163">6</text>
    <text class="t-b" x="252" y="157">Pure search</text>
    <text class="t-s" x="252" y="176">shows sources, never synthesizes</text>

    <!-- 2 · Classical ML + SHAP -->
    <circle class="node-cyan" cx="283" cy="226" r="13"/>
    <text class="t-m-c t-c" x="283" y="230">2</text>
    <text class="t-b" x="304" y="224">Classical ML + SHAP</text>
    <text class="t-s" x="304" y="243">per-feature attributions</text>

    <!-- 3 · Hybrid -->
    <circle class="node-good" cx="631" cy="140" r="14"/>
    <text class="t-m-g t-c" x="631" y="144">3</text>
    <text class="t-b" x="653" y="138">Hybrid</text>
    <text class="t-s" x="653" y="157">LLM extracts, code decides</text>

    <!-- 5 · Constrained generation -->
    <circle class="node-cyan" cx="475" cy="285" r="13"/>
    <text class="t-m-c t-c" x="475" y="289">5</text>
    <text class="t-b" x="496" y="283">Constrained generation</text>
    <text class="t-s" x="496" y="302">fixed enums or approved templates</text>

    <!-- 4 · Pinned open weights -->
    <circle class="node-cyan" cx="756" cy="348" r="13"/>
    <text class="t-m-c t-c" x="756" y="352">4</text>
    <text class="t-b t-e" x="735" y="346">Pinned open weights</text>
    <text class="t-s t-e" x="735" y="365">frozen and self-hosted, still neural</text>

    <!-- Baseline for contrast -->
    <circle cx="830" cy="404" r="11" style="fill:#f1f5f9;stroke:#475569;stroke-width:1.6;stroke-dasharray:3 3"/>
    <text class="t-b t-e" x="810" y="402" style="fill:#475569">Unconstrained LLM</text>
    <text class="t-s t-e" x="810" y="421">baseline, for contrast</text>
  </svg>
