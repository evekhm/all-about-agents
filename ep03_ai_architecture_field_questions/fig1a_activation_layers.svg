<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" role="img" aria-label="One forward pass per token: activations are computed through every layer and discarded once the next token is sampled, and only the written token is fed back as the next input" width="1840" height="1160">
  <style>
    .t-b { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
    .t-s { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #475569; }
    .t-m-c { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 12px; font-weight: 700; fill: #0369a1; }
    .t-m-v { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 12px; font-weight: 700; fill: #6d28d9; }
    .zl { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 13.2px; letter-spacing: 0.09em; font-weight: 700; fill: #475569; }
    .b-model { fill: #6d28d9; fill-opacity: 0.09; stroke: #6d28d9; stroke-width: 1.8; }
    .b-store { fill: #b45309; fill-opacity: 0.10; stroke: #b45309; stroke-width: 1.6; }
    .node-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.75; }
    .node-cyan { fill: #0369a1; fill-opacity: 0.09; stroke: #0369a1; stroke-width: 1.8; }
    .flow { stroke: #0f172a; stroke-width: 2.1; fill: none; }
  </style>
  <rect x="0" y="0" width="920" height="580" fill="#ffffff"/>
    <defs>
      <marker id="arr-q1a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 1.5 L 9 5 L 0 8.5 z" style="fill:#0f172a"/>
      </marker>
      <marker id="arr-q1a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 1.5 L 9 5 L 0 8.5 z" style="fill:#0369a1"/>
      </marker>
    </defs>

    <rect x="14" y="14" width="892" height="552" rx="14" style="fill:#f8fafc;stroke:#6d28d9;stroke-width:2"/>
    <text class="zl" x="36" y="42" style="fill:#6d28d9">ONE FORWARD PASS PER TOKEN · ONLY THE SAMPLED TOKEN IS WRITTEN DOWN</text>

    <!-- Left axis labels -->
    <text class="t-m-c" x="36" y="84">RAW TOKENS</text>
    <text class="t-s" x="36" y="103">Level 2 · token trace</text>

    <text class="t-m-v" x="36" y="182">ACTIVATIONS</text>
    <text class="t-s" x="36" y="201">Level 3 · circuit</text>
    <text class="t-s" x="36" y="219">tracing</text>

    <text class="t-m-c" x="36" y="294" style="fill:#475569">READ BACK</text>
    <text class="t-s" x="36" y="313">next input</text>

    <text class="t-m-c" x="36" y="422" style="fill:#b45309">SUMMARY</text>
    <text class="t-s" x="36" y="441">Level 1 · text overview</text>

    <!-- Column 1: ibuprofen -> needs -->
    <rect class="node-cyan" x="200" y="64" width="132" height="40" rx="8"/>
    <text class="t-b" x="266" y="90" text-anchor="middle">needs</text>
    <line x1="266" y1="126" x2="266" y2="108" class="flow" marker-end="url(#arr-q1a-ink)"/>
    <rect class="b-model" x="200" y="126" width="132" height="24" rx="6"/>
    <text class="t-s" x="266" y="143" text-anchor="middle">layer N</text>
    <rect class="b-model" x="200" y="156" width="132" height="24" rx="6"/>
    <text class="t-s" x="266" y="173" text-anchor="middle">…</text>
    <rect class="b-model" x="200" y="186" width="132" height="24" rx="6"/>
    <text class="t-s" x="266" y="203" text-anchor="middle">layer 2</text>
    <rect class="b-model" x="200" y="216" width="132" height="24" rx="6"/>
    <text class="t-s" x="266" y="233" text-anchor="middle">layer 1</text>
    <line x1="266" y1="274" x2="266" y2="244" class="flow" marker-end="url(#arr-q1a-ink)"/>
    <rect x="200" y="274" width="132" height="40" rx="8" style="fill:#ffffff;stroke:#475569;stroke-width:1.8;stroke-dasharray:6 4"/>
    <text class="t-b" x="266" y="300" text-anchor="middle">ibuprofen</text>
    <line x1="200" y1="336" x2="332" y2="336" style="stroke:#475569;stroke-width:1.4"/>
    <text class="t-s" x="266" y="356" text-anchor="middle">Prompt (case facts)</text>

    <!-- Feedback arrow 1 -> 2 -->
    <path d="M 332 84 L 352 84 L 352 294 L 366 294" class="flow" style="stroke:#0369a1" marker-end="url(#arr-q1a-cyan)"/>

    <!-- Column 2: needs -> 6 wk -->
    <rect class="node-cyan" x="370" y="64" width="132" height="40" rx="8"/>
    <text class="t-b" x="436" y="90" text-anchor="middle">6 wk</text>
    <line x1="436" y1="126" x2="436" y2="108" class="flow" marker-end="url(#arr-q1a-ink)"/>
    <rect class="b-model" x="370" y="126" width="132" height="24" rx="6"/>
    <rect class="b-model" x="370" y="156" width="132" height="24" rx="6"/>
    <rect class="b-model" x="370" y="186" width="132" height="24" rx="6"/>
    <rect class="b-model" x="370" y="216" width="132" height="24" rx="6"/>
    <line x1="436" y1="274" x2="436" y2="244" class="flow" marker-end="url(#arr-q1a-ink)"/>
    <rect class="node-cyan" x="370" y="274" width="132" height="40" rx="8"/>
    <text class="t-b" x="436" y="300" text-anchor="middle">needs</text>

    <!-- Feedback arrow 2 -> 3 -->
    <path d="M 502 84 L 522 84 L 522 294 L 536 294" class="flow" style="stroke:#0369a1" marker-end="url(#arr-q1a-cyan)"/>

    <!-- Column 3: 6 wk -> PT -->
    <rect class="node-cyan" x="540" y="64" width="132" height="40" rx="8"/>
    <text class="t-b" x="606" y="90" text-anchor="middle">PT</text>
    <line x1="606" y1="126" x2="606" y2="108" class="flow" marker-end="url(#arr-q1a-ink)"/>
    <rect class="b-model" x="540" y="126" width="132" height="24" rx="6"/>
    <rect class="b-model" x="540" y="156" width="132" height="24" rx="6"/>
    <rect class="b-model" x="540" y="186" width="132" height="24" rx="6"/>
    <rect class="b-model" x="540" y="216" width="132" height="24" rx="6"/>
    <line x1="606" y1="274" x2="606" y2="244" class="flow" marker-end="url(#arr-q1a-ink)"/>
    <rect class="node-cyan" x="540" y="274" width="132" height="40" rx="8"/>
    <text class="t-b" x="606" y="300" text-anchor="middle">6 wk</text>

    <!-- Feedback arrow 3 -> 4 -->
    <path d="M 672 84 L 692 84 L 692 294 L 706 294" class="flow" style="stroke:#0369a1" marker-end="url(#arr-q1a-cyan)"/>

    <!-- Column 4: PT -> fail -->
    <rect class="node-cyan" x="710" y="64" width="132" height="40" rx="8"/>
    <text class="t-b" x="776" y="90" text-anchor="middle">fail</text>
    <line x1="776" y1="126" x2="776" y2="108" class="flow" marker-end="url(#arr-q1a-ink)"/>
    <rect class="b-model" x="710" y="126" width="132" height="24" rx="6"/>
    <rect class="b-model" x="710" y="156" width="132" height="24" rx="6"/>
    <rect class="b-model" x="710" y="186" width="132" height="24" rx="6"/>
    <rect class="b-model" x="710" y="216" width="132" height="24" rx="6"/>
    <line x1="776" y1="274" x2="776" y2="244" class="flow" marker-end="url(#arr-q1a-ink)"/>
    <rect class="node-cyan" x="710" y="274" width="132" height="40" rx="8"/>
    <text class="t-b" x="776" y="300" text-anchor="middle">PT</text>

    <!-- Raw thinking trace bracket & arrow to Thought Summary -->
    <line x1="370" y1="336" x2="842" y2="336" style="stroke:#0369a1;stroke-width:1.6"/>
    <text class="t-s" x="606" y="356" text-anchor="middle">Raw thinking trace: real sampled tokens</text>
    <line x1="606" y1="366" x2="606" y2="394" class="flow" marker-end="url(#arr-q1a-ink)"/>

    <!-- Thought Summary box -->
    <rect class="b-store" x="424" y="398" width="364" height="58" rx="9"/>
    <text class="t-b" x="606" y="423" text-anchor="middle">Thought summary</text>
    <text class="t-s" x="606" y="444" text-anchor="middle">A separate pass condenses the raw trace</text>

    <!-- Bottom comparison note -->
    <rect class="node-card" x="36" y="476" width="848" height="72" rx="9"/>
    <text class="t-s" x="56" y="504"><tspan style="font-weight:700;fill:#0f172a">Proprietary API:</tspan> usually the thought summary only; weights, activations, and raw tokens stay with the provider</text>
    <text class="t-s" x="56" y="530"><tspan style="font-weight:700;fill:#0f172a">Open weights:</tspan> raw tokens, plus activations recorded with forward-pass hooks and decoded with SAEs</text>
  </svg>
