    <rect x="14" y="14" width="892" height="594" rx="14" style="fill:var(--panel-2);stroke:var(--line);stroke-width:1.75"/>
    <text class="zl" x="34" y="42">ON GOOGLE CLOUD · THE MODEL STAYS OPAQUE · TRUST COMES FROM CHECKS AROUND IT</text>

    <!-- A: data perimeter -->
    <rect x="34" y="58" width="852" height="390" rx="12" style="fill:none;stroke:var(--cyan);stroke-width:1.8;stroke-dasharray:7 5"/>
    <text class="t-m-c" x="50" y="83">A · DATA PERIMETER:</text>
    <use href="#icon-gcp-vpc" x="202" y="67" width="20" height="20"/>
    <use href="#icon-gcp-kms" x="226" y="67" width="20" height="20"/>
    <use href="#icon-gcp-aw" x="250" y="67" width="20" height="20"/>
    <text class="t-s" x="278" y="82">VPC Service Controls · CMEK (Cloud KMS) · Assured Workloads</text>

    <!-- Request path, in order -->
    <rect class="node-dim" x="350" y="96" width="120" height="24" rx="12"/>
    <text class="t-s t-c" x="410" y="112">request</text>
    <line class="flow" x1="410" y1="120" x2="410" y2="134" marker-end="url(#arr-q1g-ink)"/>

    <!-- A: Screen input -->
    <rect class="node-card" x="200" y="138" width="420" height="44" rx="9"/>
    <use href="#icon-gcp-armor" x="216" y="148" width="24" height="24"/>
    <text class="t-b" x="250" y="157">Model Armor</text>
    <text class="t-s" x="250" y="174">screen input for PII, toxicity, prompt injection</text>
    <line class="flow" x1="410" y1="182" x2="410" y2="196" marker-end="url(#arr-q1g-ink)"/>

    <!-- B: Ground in their sources -->
    <rect class="node-cyan" x="200" y="200" width="420" height="44" rx="9"/>
    <use href="#icon-gcp-ap" x="216" y="210" width="24" height="24"/>
    <text class="t-b" x="250" y="219">B · RAG Engine (Agent Platform)</text>
    <text class="t-s" x="250" y="236">ground in customer documents with citations</text>
    <line class="flow" x1="410" y1="244" x2="410" y2="258" marker-end="url(#arr-q1g-ink)"/>

    <!-- Model -->
    <rect class="node-violet" x="200" y="262" width="420" height="44" rx="9" style="stroke-dasharray:6 4"/>
    <use href="#icon-gcp-gemini" x="212" y="272" width="22" height="22"/>
    <use href="#icon-gcp-ap" x="236" y="272" width="22" height="22"/>
    <text class="t-b" x="268" y="281">Gemini on Agent Platform</text>
    <text class="t-s" x="268" y="298">or open weights from Model Garden</text>
    <line class="flow" x1="410" y1="306" x2="410" y2="320" marker-end="url(#arr-q1g-ink)"/>

    <!-- C: Check outputs in code -->
    <rect class="node-cyan" x="200" y="324" width="420" height="44" rx="9"/>
    <use href="#icon-gcp-armor" x="212" y="334" width="22" height="22"/>
    <use href="#icon-gcp-run" x="236" y="334" width="22" height="22"/>
    <text class="t-b" x="268" y="343">C · Model Armor + Cloud Run</text>
    <text class="t-s" x="268" y="360">output screening + structured schemas &amp; rules</text>
    <line class="flow" x1="410" y1="368" x2="410" y2="382" marker-end="url(#arr-q1g-ink)"/>

    <!-- D: Route by risk -->
    <rect class="node-cyan" x="200" y="386" width="420" height="44" rx="9"/>
    <use href="#icon-gcp-log" x="216" y="396" width="24" height="24"/>
    <text class="t-b" x="250" y="405">D · Your review queue</text>
    <text class="t-s" x="250" y="422">sign-offs logged to Cloud Logging</text>

    <!-- E: Log every step -->
    <rect class="node-cyan" x="640" y="138" width="226" height="292" rx="9"/>
    <use href="#icon-gcp-log" x="723" y="236" width="26" height="26"/>
    <use href="#icon-gcp-trace" x="757" y="236" width="26" height="26"/>
    <text class="t-b t-c" x="753" y="284">E · Cloud Logging,</text>
    <text class="t-b t-c" x="753" y="303">Cloud Trace</text>
    <text class="t-s t-c" x="753" y="325">replayable months later</text>

    <!-- Output -->
    <line class="flow" x1="410" y1="430" x2="410" y2="464" marker-end="url(#arr-q1g-ink)"/>
    <rect class="node-card" x="200" y="468" width="420" height="40" rx="9"/>
    <text class="t-b t-c" x="410" y="493">Answer with citations</text>

    <!-- F and G: controls on every change -->
    <rect class="node-good" x="34" y="530" width="418" height="58" rx="9"/>
    <use href="#icon-gcp-ap" x="50" y="546" width="26" height="26"/>
