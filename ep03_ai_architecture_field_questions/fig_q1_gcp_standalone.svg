<svg aria-label="The same seven layers on Google Cloud, lettered A to G in request-flow order. Inside a VPC Service Controls, CMEK (Cloud KMS), Assured Workloads, and IAM Principal Access Boundary perimeter, a request enters via Agent Gateway or Apigee with IAP and Cloud Armor and is screened by Model Armor and Sensitive Data Protection (A), grounded with RAG Engine on Agent Platform (B), handled by Gemini on Agent Platform or open weights from Model Garden, checked by Agent Gateway, Model Armor with Cloud SDP, Semantic Governance Policies, Agent Registry, and your service on Cloud Run with structured output schemas (C), and routed by risk to the customer's review queue (Pub/Sub or Workflows) with sign-offs stored in Cloud SQL or Firestore (D), while Cloud Logging, Cloud Trace, Cloud Audit Logs, Security Command Center, and a BigQuery and Cloud Storage sink record every step for multi-month replay (E). The Agent Platform evaluation service and pinned model version IDs gate every change (F), and shadow comparisons with Cloud Run traffic splitting or a feature-flag kill switch govern graduated rollout (G)." role="img" viewbox="0 0 920 622">
