<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 622" width="920" height="622" role="img" aria-label="The same seven layers on Google Cloud, lettered A to G in request-flow order. Inside a VPC Service Controls, CMEK (Cloud KMS), and Assured Workloads perimeter, a request is screened by Model Armor (A), grounded with RAG Engine on Agent Platform (B), handled by Gemini on Agent Platform or open weights from Model Garden, checked by Model Armor and your service on Cloud Run with structured output schemas (C), and routed by risk to your review queue with sign-offs logged to Cloud Logging (D), while Cloud Logging and Cloud Trace record every step (E). The Agent Platform evaluation service and pinned model version IDs gate every change (F), and shadow comparisons with a feature-flag kill switch govern graduated rollout (G).">
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --panel-3: #f1f5f9;
      --ink: #0f172a;
      --muted: #475569;
      --line: #cbd5e1;
      --cyan: #0369a1;
      --cyan-soft: rgba(3, 105, 161, 0.09);
      --good: #15803d;
      --good-soft: rgba(21, 128, 61, 0.09);
      --violet: #6d28d9;
      --violet-soft: rgba(109, 40, 217, 0.09);
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: "JetBrains Mono", Menlo, Consolas, monospace;
    }
    svg { font-family: var(--sans); background: var(--bg); }
    .zl { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.09em; fill: var(--muted); }
    .t-b { font-size: 14px; font-weight: 700; fill: var(--ink); }
    .t-s { font-size: 12px; font-weight: 500; fill: var(--muted); }
    .t-m-c { font-family: var(--mono); font-size: 12px; font-weight: 700; fill: var(--cyan); }
    .t-c { text-anchor: middle; }
    .flow { stroke: var(--ink); stroke-width: 1.8; fill: none; }
    .node-dim { fill: var(--panel-3); stroke: var(--line); stroke-width: 1.4; }
    .node-card { fill: var(--panel); stroke: var(--line); stroke-width: 1.6; }
    .node-cyan { fill: var(--cyan-soft); stroke: var(--cyan); stroke-width: 1.8; }
    .node-good { fill: var(--good-soft); stroke: var(--good); stroke-width: 1.8; }
    .node-violet { fill: var(--violet-soft); stroke: var(--violet); stroke-width: 1.8; }
  </style>
