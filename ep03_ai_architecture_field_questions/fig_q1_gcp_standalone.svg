<rect height="594" rx="14" style="fill:var(--panel-2);stroke:var(--line);stroke-width:1.75" width="892" x="14" y="14"></rect>
<text class="zl" x="34" y="42">ON GOOGLE CLOUD · THE MODEL STAYS OPAQUE · TRUST COMES FROM CHECKS AROUND IT</text>
<!-- A: data perimeter -->
<rect height="390" rx="12" style="fill:none;stroke:var(--cyan);stroke-width:1.8;stroke-dasharray:7 5" width="852" x="34" y="58"></rect>
<text class="t-m-c" x="50" y="83">A · DATA PERIMETER:</text>
<use height="20" href="#icon-gcp-vpc" width="20" x="202" y="67"></use>
<use height="20" href="#icon-gcp-kms" width="20" x="226" y="67"></use>
<use height="20" href="#icon-gcp-aw" width="20" x="250" y="67"></use>
<text class="t-s" x="278" y="82">VPC Service Controls · CMEK · Assured Workloads · IAM PAB</text>
<!-- Request path, in order -->
<rect class="node-dim" height="24" rx="12" width="120" x="350" y="96"></rect>
<text class="t-s t-c" x="410" y="112">request</text>
<line class="flow" marker-end="url(#arr-q1g-ink)" x1="410" x2="410" y1="120" y2="134"></line>
<!-- Screen input at the perimeter edge -->
<rect class="node-card" height="44" rx="9" width="420" x="200" y="138"></rect>
<use height="24" href="#icon-gcp-armor" width="24" x="216" y="148"></use>
<text class="t-b" x="250" y="157">Agent Gateway · Model Armor + SDP</text>
<text class="t-s" x="250" y="174">screen prompts, PII, injection</text>
<line class="flow" marker-end="url(#arr-q1g-ink)" x1="410" x2="410" y1="182" y2="196"></line>
<!-- B: Ground in customer sources -->
<rect class="node-cyan" height="44" rx="9" width="420" x="200" y="200"></rect>
<use height="24" href="#icon-gcp-ap" width="24" x="216" y="210"></use>
<text class="t-b" x="250" y="219">B · RAG Engine (Agent Platform)</text>
<text class="t-s" x="250" y="236">ground in customer sources</text>
<line class="flow" marker-end="url(#arr-q1g-ink)" x1="410" x2="410" y1="244" y2="258"></line>
<!-- Model -->
<rect class="node-violet" height="44" rx="9" style="stroke-dasharray:6 4" width="420" x="200" y="262"></rect>
<use height="22" href="#icon-gcp-gemini" width="22" x="212" y="272"></use>
<use height="22" href="#icon-gcp-ap" width="22" x="236" y="272"></use>
<text class="t-b" x="268" y="281">Gemini on Agent Platform</text>
<text class="t-s" x="268" y="298">or Model Garden open weights</text>
<line class="flow" marker-end="url(#arr-q1g-ink)" x1="410" x2="410" y1="306" y2="320"></line>
<!-- C: Check outputs in code -->
<rect class="node-cyan" height="44" rx="9" width="420" x="200" y="324"></rect>
<use height="22" href="#icon-gcp-armor" width="22" x="212" y="334"></use>
<use height="22" href="#icon-gcp-run" width="22" x="236" y="334"></use>
<text class="t-b" x="268" y="343">C · Model Armor + Cloud Run</text>
<text class="t-s" x="268" y="360">egress SDP · SGP · schemas &amp; rules</text>
<line class="flow" marker-end="url(#arr-q1g-ink)" x1="410" x2="410" y1="368" y2="382"></line>
<!-- D: Route by risk -->
<rect class="node-cyan" height="44" rx="9" width="420" x="200" y="386"></rect>
<use height="24" href="#icon-gcp-run" width="24" x="216" y="396"></use>
<text class="t-b" x="250" y="405">D · Customer review queue</text>
<text class="t-s" x="250" y="422">Workflows · Cloud SQL / Firestore</text>
<!-- E: Log every step -->
<rect class="node-cyan" height="292" rx="9" width="226" x="640" y="138"></rect>
<use height="26" href="#icon-gcp-log" width="26" x="723" y="226"></use>
<use height="26" href="#icon-gcp-trace" width="26" x="757" y="226"></use>
<text class="t-b t-c" x="753" y="274">E · Logging, Trace,</text>
<text class="t-b t-c" x="753" y="294">Audit &amp; SCC</text>
<text class="t-s t-c" x="753" y="318">+ BigQuery audit sink</text>
<!-- Output -->
<line class="flow" marker-end="url(#arr-q1g-ink)" x1="410" x2="410" y1="430" y2="464"></line>
<rect class="node-card" height="40" rx="9" width="420" x="200" y="468"></rect>
<text class="t-b t-c" x="410" y="493">Answer with citations</text>
