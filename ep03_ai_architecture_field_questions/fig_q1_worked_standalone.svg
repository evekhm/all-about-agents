<svg viewBox="0 0 920 310" role="img" aria-label="Higher-automation hybrid prior-authorization flow: chart and policy enter, a toolless Quarantined LLM normalizes clinical facts with verbatim quotes, a Verifier and Policy Engine checks quotes and evaluates a declarative CEL or CQL rule for touchless AUTO_APPROVE, a scoped read-only Record-Chaser Agent searches FHIR when evidence is missing, and unmet or unresolved cases route neutrally to a licensed clinician">
  <defs>
    <marker id="arr-q1w-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" style="fill:var(--ink)"/>
    </marker>
    <marker id="arr-q1w-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" style="fill:var(--good)"/>
    </marker>
  </defs>

    <rect x="14" y="14" width="892" height="282" rx="14" style="fill:var(--panel-2);stroke:var(--line);stroke-width:1.75"/>
    <text class="zl" x="34" y="42">THE MODEL READS · CODE DECIDES · A CLINICIAN OWNS EVERY DENIAL</text>

    <!-- Row 1: left to right -->
    <rect class="node-dim" x="34" y="66" width="136" height="64" rx="9"/>
    <text class="t-b t-c" x="102" y="92">Chart + policy</text>
    <text class="t-s t-c" x="102" y="113">clinical record</text>
    <line class="flow" x1="170" y1="98" x2="194" y2="98" marker-end="url(#arr-q1w-ink)"/>

    <rect class="node-violet" x="196" y="66" width="234" height="64" rx="9"/>
    <text class="t-b t-c" x="313" y="92">Quarantined LLM</text>
    <text class="t-s t-c" x="313" y="113">normalizes + quotes (no tools)</text>
    <line class="flow" x1="430" y1="98" x2="454" y2="98" marker-end="url(#arr-q1w-ink)"/>

    <rect class="node-cyan" x="456" y="66" width="254" height="64" rx="9"/>
    <text class="t-b t-c" x="583" y="92">Code Verifier &amp; Rule</text>
    <text class="t-s t-c" x="583" y="113">checks quotes · applies (a) OR (b)</text>
    <line class="flow-g" x1="710" y1="98" x2="734" y2="98" marker-end="url(#arr-q1w-good)"/>

    <rect class="node-good" x="736" y="66" width="150" height="64" rx="9"/>
    <text class="t-m-g t-c" x="811" y="93">AUTO_APPROVE</text>
    <text class="t-s t-c" x="811" y="114">verified (a) or (b)</text>

    <!-- Down from Verifier to Row 2 -->
    <line class="flow" x1="583" y1="130" x2="583" y2="168" marker-end="url(#arr-q1w-ink)"/>

    <!-- Row 2: EHR lookup -> Clinician review -->
    <rect class="node-cyan" x="504" y="172" width="382" height="100" rx="9"/>
    <text class="t-b t-c" x="695" y="199">Missing evidence: read-only lookup</text>
    <text class="t-s t-c" x="695" y="223">fetch missing exam notes &amp; re-run once</text>
    <text class="t-s t-c" x="695" y="245">still absent → send PEND_FOR_EVIDENCE</text>
    <path d="M 540 172 V 150 H 313 V 134" style="fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:5 4" marker-end="url(#arr-q1w-ink)"/>
    <text class="t-s t-c" x="426" y="145" style="font-size:11px;fill:var(--muted)">notes found</text>
    <line class="flow-g" x1="504" y1="222" x2="468" y2="222" marker-end="url(#arr-q1w-good)"/>

    <rect class="node-good" x="34" y="172" width="430" height="100" rx="9"/>
    <text class="t-m-g t-c" x="249" y="199">LICENSED CLINICIAN REVIEW</text>
    <text class="t-b t-c" x="249" y="224">Verified facts side by side</text>
    <text class="t-s t-c" x="249" y="247">required when unmet (only clinicians deny)</text>
  </svg>
