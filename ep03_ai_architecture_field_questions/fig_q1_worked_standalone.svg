<svg aria-label="Verifiable hybrid prior-authorization flow: the chart and policy enter, the model extracts structured facts with verbatim quotes, code verifies the quotes in the chart and applies policy criteria (a) and (b), and because (b) has missing evidence, code routes to PEND_FOR_EVIDENCE to request neuro exam notes followed by clinician review" role="img" viewbox="0 0 920 310">
<defs>
<marker id="arr-q1w-ink" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 1.5 L 9 5 L 0 8.5 z" style="fill:var(--ink)"></path>
</marker>
<marker id="arr-q1w-good" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 1.5 L 9 5 L 0 8.5 z" style="fill:var(--good)"></path>
</marker>
</defs>
<rect height="282" rx="14" style="fill:var(--panel-2);stroke:var(--line);stroke-width:1.75" width="892" x="14" y="14"></rect>
<text class="zl" x="34" y="42">VERIFIABLE HYBRID WORKFLOW · THE MODEL EXTRACTS, CODE CHECKS</text>
<!-- Row 1: left to right -->
<rect class="node-dim" height="64" rx="9" width="146" x="34" y="68"></rect>
<text class="t-b t-c" x="107" y="94">Chart + policy</text>
<text class="t-s t-c" x="107" y="115">clinical record</text>
<line class="flow" marker-end="url(#arr-q1w-ink)" x1="180" x2="210" y1="100" y2="100"></line>
<rect class="node-violet" height="64" rx="9" width="196" x="214" y="68"></rect>
<text class="t-b t-c" x="312" y="94">Model extracts</text>
<text class="t-s t-c" x="312" y="115">facts + verbatim quotes</text>
<line class="flow" marker-end="url(#arr-q1w-ink)" x1="410" x2="440" y1="100" y2="100"></line>
<rect class="node-cyan" height="64" rx="9" width="196" x="444" y="68"></rect>
<text class="t-b t-c" x="542" y="94">Code verifies</text>
<text class="t-s t-c" x="542" y="115">quotes found in chart</text>
<line class="flow" marker-end="url(#arr-q1w-ink)" x1="640" x2="670" y1="100" y2="100"></line>
<rect class="node-cyan" height="64" rx="9" width="210" x="674" y="68"></rect>
<text class="t-b t-c" x="779" y="94">Code applies rule</text>
<text class="t-s t-c" x="779" y="115">policy criteria (a) and (b)</text>
<line class="flow" marker-end="url(#arr-q1w-ink)" x1="779" x2="779" y1="132" y2="162"></line>
<!-- Row 2: rule evaluation + outcome -->
<rect class="node-card" height="106" rx="9" width="360" x="524" y="166"></rect>
<text class="t-b" x="544" y="192">Rule: (a) OR (b) approves</text>
<text class="t-s" x="544" y="214">(a) ≥ 6 wks conservative care → 3 wks (not met)</text>
<text class="t-s" x="544" y="234">(b) neuro deficit → missing evidence</text>
<text class="t-s" x="544" y="254">Either met → AUTO_APPROVE · (b) open → PEND</text>
<line class="flow-g" marker-end="url(#arr-q1w-good)" x1="524" x2="468" y1="219" y2="219"></line>
<rect class="node-good" height="106" rx="9" width="430" x="34" y="166"></rect>
<text class="t-m-g t-c" x="249" y="196">PEND_FOR_EVIDENCE</text>
<text class="t-b t-c" x="249" y="222">Request missing exam notes</text>
<text class="t-s t-c" x="249" y="246">then licensed clinician review with verified facts</text>
</svg>
